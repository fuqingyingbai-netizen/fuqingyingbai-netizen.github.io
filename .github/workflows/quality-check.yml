name: Quality Check

# 推送、每周定时和手动触发时执行：构建校验 + 项目页同步校验 + 外链检查
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  schedule:
    # 每周一 06:30（北京时间）= 每周日 22:30 UTC
    - cron: "30 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: 准备 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: 构建站点（校验 front matter 与模板）
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -d _site

      - name: 运行单元测试
        run: |
          python -m unittest discover -s tools/tests -v
          node --test tools/tests/moderation.test.cjs

      - name: 检查项目页是否与 GitHub 数据一致
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_projects.py --check

      - name: 检查站内链接
        run: python tools/check_internal_links.py

      - name: 检查搜索定位与当前评论模式
        run: python tools/check_site_contracts.py

      - name: 保存 PR 预览页面
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 3

      - name: 检查 WebKit 手机菜单、放大文字与横屏切换
        env:
          NODE_PATH: ${{ runner.temp }}/mobile-layout/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-layout" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/mobile-layout/node_modules/playwright/cli.js" install --with-deps webkit
          python -m http.server 4173 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/mobile-layout-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 0.5
          done
          node tools/check_mobile_layout.cjs
          node tools/check_page_motion.cjs
          node tools/check_react_bits.cjs
          node tools/check_home_space.cjs
          node tools/check_contextual_reading.cjs

      - name: 校验前端与评论服务入口语法
        run: |
          node --check assets/js/site-accessibility.js
          node --check assets/js/site-motion.js
          node --check assets/js/react-bits.js
          node --check assets/js/react-bits-interactions.js
          node --check assets/js/site-navigation.js
          node --check assets/js/home-scene.js
          node --check assets/js/context-panel.js
          node --check assets/js/career.js
          node --check assets/js/visitor-comments.js
          node --check tools/waline-server/api/index.js

      - name: 构建并校验 Waline 适配（不连接真实后端）
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --config _config.yml,tools/tests/waline-preview.yml -d _site-waline
          python tools/check_site_contracts.py --site _site-waline --waline
          python tools/check_internal_links.py --site _site-waline

      - name: 保存 Waline 适配预览
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-waline
          path: _site-waline
          retention-days: 3

      - name: 检查文章与页面中的外部链接
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --base-url https://fuqingyingbai-netizen.github.io
            --accept 200,204,206,301,302,403,429
            ./_posts/*.md ./_tabs/*.md ./README.md
          fail: false
