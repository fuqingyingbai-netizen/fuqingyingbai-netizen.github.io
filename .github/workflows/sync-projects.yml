name: Sync Projects

# 定时从 GitHub API 同步仓库信息，自动更新网站的项目展示页
on:
  schedule:
    # 每周一 06:00（北京时间）= 每周日 22:00 UTC
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 同步 GitHub 项目信息
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_projects.py

      - name: 提交并推送变更
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "项目信息没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tabs/projects.md
          git commit -m "chore: 自动同步 GitHub 项目信息"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 触发的推送不会自动触发其他工作流，这里手动触发网站部署
      - name: 触发网站重新构建
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
